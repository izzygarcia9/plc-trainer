<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladder Lab — Ladder Logic Editor</title>
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <header>
        <h1>&#9889; Ladder Lab</h1>
        <div class="header-controls">
            <button id="run-btn" onclick="toggleRun()">&#9654; RUN</button>
            <button onclick="singleScan()">&#9193; Scan</button>
            <span class="scan-label">Scan #<strong id="scan-num">0</strong></span>
            <span class="scan-label"><strong id="scan-ms">200</strong>ms</span>
            <input type="range" id="speed-slider" min="50" max="1000" value="200" step="50" oninput="setScanSpeed(this.value)">
        </div>
        <div class="nav-links"><a href="index.html" class="nav-link">&#8592; Hub</a></div>
    </header>

    <div class="challenge-banner" id="challenge-banner">
        <select id="challenge-select" onchange="loadChallenge(this.value)" style="background:#1a1d29;color:#00d4ff;border:1px solid #333;border-radius:4px;padding:4px 8px;font-size:.75rem;margin-right:8px">
            <option value="free">Free Build (no challenge)</option>
            <option value="ae1" selected>AE-1: One-Shot Toggle Latch</option>
            <option value="ae2">AE-2: Compare 5 Variables — Find Highest</option>
            <option value="ae4">AE-4: HVAC Heating/Cooling</option>
            <option value="ae5">AE-5: Bottle Fill Conveyor</option>
            <option value="ae7">AE-7: Shuttle Motor PE1/PE2</option>
            <option value="ae9">AE-9: Traffic Light Sequencer</option>
            <option value="ae12">AE-12: Spiral Package Counter</option>
            <option value="ae16">AE-16: Pallet Counter</option>
            <option value="ae18">AE-18: Divisibility Check</option>
        </select>
        <span id="challenge-text"><strong>Challenge:</strong> Create a one-shot push button. When pressed once, latch the bulb ON. When pressed again, turn it OFF.</span>
    </div>

    <div class="workspace">
        <!-- Tag Panel -->
        <aside id="tag-panel">
            <h3>Tags <button class="small-btn" onclick="addTagPrompt()">+ Add</button></h3>
            <div id="tag-list"></div>
        </aside>

        <!-- Ladder Editor -->
        <section id="ladder-editor">
            <div class="toolbar">
                <span class="tb-label">Add Instruction:</span>
                <button class="inst-btn" draggable="true" data-inst="XIC" onclick="addInst('XIC')" title="Examine If Closed (NO)">&#9472;] [&#9472; XIC</button>
                <button class="inst-btn" draggable="true" data-inst="XIO" onclick="addInst('XIO')" title="Examine If Open (NC)">&#9472;]/[&#9472; XIO</button>
                <button class="inst-btn coil-btn" draggable="true" data-inst="OTE" onclick="addInst('OTE')" title="Output Energize">&#9472;( )&#9472; OTE</button>
                <button class="inst-btn coil-btn" draggable="true" data-inst="OTL" onclick="addInst('OTL')" title="Output Latch">&#9472;(L)&#9472; OTL</button>
                <button class="inst-btn coil-btn" draggable="true" data-inst="OTU" onclick="addInst('OTU')" title="Output Unlatch">&#9472;(U)&#9472; OTU</button>
                <button class="inst-btn math-btn" draggable="true" data-inst="TON" onclick="addInst('TON')" title="Timer On-Delay">TON</button>
                <button class="inst-btn math-btn" draggable="true" data-inst="CTU" onclick="addInst('CTU')" title="Count Up">CTU</button>
                <button class="inst-btn math-btn" draggable="true" data-inst="CTD" onclick="addInst('CTD')" title="Count Down">CTD</button>
                <button class="inst-btn math-btn" draggable="true" data-inst="MOV" onclick="addInst('MOV')" title="Move">MOV</button>
                <button class="inst-btn math-btn" draggable="true" data-inst="ADD" onclick="addInst('ADD')" title="Add">ADD</button>
                <button class="inst-btn math-btn" draggable="true" data-inst="SUB" onclick="addInst('SUB')" title="Subtract">SUB</button>
                <button class="inst-btn math-btn" draggable="true" data-inst="MUL" onclick="addInst('MUL')" title="Multiply">MUL</button>
                <button class="inst-btn math-btn" draggable="true" data-inst="DIV" onclick="addInst('DIV')" title="Divide">DIV</button>
                <button class="inst-btn cmp-btn" draggable="true" data-inst="GRT" onclick="addInst('GRT')" title="Greater Than">GRT</button>
                <button class="inst-btn cmp-btn" draggable="true" data-inst="LES" onclick="addInst('LES')" title="Less Than">LES</button>
                <button class="inst-btn cmp-btn" draggable="true" data-inst="EQU" onclick="addInst('EQU')" title="Equal">EQU</button>
                <button class="inst-btn cmp-btn" draggable="true" data-inst="GEQ" onclick="addInst('GEQ')" title="Greater or Equal">GEQ</button>
                <button class="inst-btn cmp-btn" draggable="true" data-inst="LEQ" onclick="addInst('LEQ')" title="Less or Equal">LEQ</button>
                <button class="inst-btn cmp-btn" draggable="true" data-inst="NEQ" onclick="addInst('NEQ')" title="Not Equal">NEQ</button>
                <span class="tb-sep">|</span>
                <button class="inst-btn rung-btn" onclick="addRung()">+ Rung</button>
            </div>
            <div id="rungs-container"></div>
        </section>

        <!-- I/O Panel -->
        <aside id="io-panel">
            <h3>I/O Monitor</h3>
            <div id="io-list"></div>
        </aside>
    </div>

    <script src="editor-engine.js"></script>
    <script src="editor-ui.js"></script>
</body>
</html>
